<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Projet 1-38</title>
    <script src="https://unpkg.com/vue@next"></script>
    <style>
        img {
            float: left;
            margin-right: 1rem;
        }
        .personne {
            clear: left;
            padding: 1rem;
        }
        input[type="checkbox"], select {
            margin-right: 1rem;
        }
        .misEnForme {
            background: #e0ffff;
            font-family: georgia;
            font-size: 1.2rem;
            margin: 1rem;
        }
    </style>
</head>

<body>
<div id="app">
    <fieldset>
        <legend>Filtre sur le nom</legend>
        <input type="text" v-model="filtreNom">
    </fieldset>
    <fieldset>
        <legend>Options</legend>
        Homme <input type="checkbox" v-model="homme">
        Femme <input type="checkbox" v-model="femme">
        Téléphone <input type="checkbox" v-model="tel">
        Photo
        <select v-model.number="taille">
            <option value="1">Petit</option>
            <option value="2">Moyen</option>
            <option value="3">Grand</option>
        </select>
        Mise en forme <input type="checkbox" v-model="mef">
    </fieldset>

    <div class="personne" :class="{ misEnForme: mef }" v-for="p in personnes" :key="p.login.uuid">
        <div v-if="(((homme && p.name.title=='Mr')
                       || (femme && p.name.title=='Mrs'))
                       && (p.name.last.indexOf(filtreNom)>=0
                       || filtreNom==''))">

            <img v-if="taille==1" :src="p.picture.thumbnail">
            <img v-if="taille==2" :src="p.picture.medium">
            <img v-if="taille==3" :src="p.picture.large">

            {{ p.name.last }} {{ p.name.first }}<br>
            {{ p.location.country }}<br>

            <button @click="visibles[p.login.uuid] = !visibles[p.login.uuid]">
                {{ visibles[p.login.uuid] ? 'Cacher' : 'Afficher' }} les contacts
            </button>

            <div v-if="visibles[p.login.uuid]">
                <div v-if="tel">Tel : {{ p.phone }}</div>
                <div>Email : {{ p.email }}</div>
            </div>
        </div>
    </div>
</div>

<script>
    const app = Vue.createApp({
        data() {
            return {
                homme: true,
                femme: true,
                tel: true,
                mef: false,
                taille: 2,
                filtreNom: '',
                personnes: [],
                visibles: {}
            }
        },
        mounted() {
            fetch('personnes.json')
                .then(r => r.json())
                .then(data => this.personnes = data);
        }
    });
    app.mount('#app');
</script>
</body>

</html>
